  <title>Production — Elk Grove Toy Drive Celebration</title>
  <script src="../clean-urls.js"></script>
  <script>
    (function () {
      try {
        var t = sessionStorage.getItem("toydrive-theme");
        if (t === "light" || t === "dark") {
          document.documentElement.setAttribute("data-theme", t);
          document.documentElement.setAttribute("data-ls-scheme", t);
        }
      } catch (_) {}
    })();
  </script>
  <link rel="stylesheet" href="/vendor/lsds/fonts/metropolis.css" />
  <link rel="stylesheet" href="/vendor/lsds/lsds.css" />
  <link rel="stylesheet" href="/vendor/lsds/themes/verdant.css" />
  <link rel="stylesheet" href="../site.css" />
</head>
<body>
  <div id="site-nav"></div>
  <main class="page-wrap page-wrap--doc" id="main">
    <div id="seo-prerender" class="seo-prerender">
      <section class="hero">
        <h1>Production</h1>
        <p>Team, volunteering, sponsorship, and Fund the Fete — the tools that build the celebration.</p>
      </section>
    </div>
  </main>
  <div id="site-footer"></div>
  <script src="/vendor/lsds/lsds.iife.js"></script>
  <script src="../doc-scroll.js"></script>
  <script src="../site.js"></script>
  <script>
    (async function () {
      const { initPageShell, loadSiteData, mountFooter, renderProductionPage, setPageTitle, escapeHtml } =
        window.ToyDriveSite;
      initPageShell("production");
      try {
        const site = await loadSiteData();
        setPageTitle(site, "Production");
        document.getElementById("main").innerHTML = renderProductionPage(site.production);
        mountFooter(site);
      } catch (err) {
        document.getElementById("main").innerHTML = `<p class="error-panel">${escapeHtml(err.message)}</p>`;
      }
    })();
  </script>
</body>
</html>
