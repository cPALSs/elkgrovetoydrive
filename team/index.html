<!DOCTYPE html>
<html lang="en" data-theme="auto" data-ls-theme="verdant" data-ls-scheme="auto">
<head>
  <meta charset="UTF-8" />
  <script async src="https://www.googletagmanager.com/gtag/js?id=G-934PPCQGLJ"></script>
  <script src="../analytics.js"></script>

  <meta name="viewport" content="width=device-width, initial-scale=1" />
  <meta name="description" content="Meet the Toy Drive 2026 chairs, co-host, and support team — open director roles under each lane." />
  <link rel="canonical" href="https://elkgrovetoydrive.com/team/" />
  <meta property="og:title" content="Team — Elk Grove Toy Drive Celebration" />
  <meta property="og:description" content="Who is working Elk Grove Toy Drive Celebration 2026. Open director seats live under each lane." />
  <meta property="og:type" content="website" />
  <meta property="og:url" content="https://elkgrovetoydrive.com/team/" />
  <meta name="twitter:card" content="summary" />
  <meta name="twitter:title" content="Team — Elk Grove Toy Drive Celebration" />
  <meta name="twitter:description" content="Who is working Elk Grove Toy Drive Celebration 2026. Open director seats live under each lane." />

  <title>Team — Elk Grove Toy Drive Celebration</title>
  <script src="../clean-urls.js"></script>
  <script>
    (function () {
      try {
        var t = sessionStorage.getItem("toydrive-theme");
        if (t === "light" || t === "dark") {
          document.documentElement.setAttribute("data-theme", t);
          document.documentElement.setAttribute("data-ls-scheme", t);
        }
      } catch (_) {}
    })();
  </script>
  <link rel="stylesheet" href="/vendor/lsds/fonts/metropolis.css" />
  <link rel="stylesheet" href="/vendor/lsds/lsds.css" />
  <link rel="stylesheet" href="/vendor/lsds/themes/verdant.css" />
  <link rel="stylesheet" href="../site.css" />
</head>
<body>
  <div id="site-nav"></div>
  <main class="page-wrap page-wrap--doc" id="main">
    <div id="seo-prerender" class="seo-prerender">
      <section class="hero">
        <h1>Team</h1>
        <p>Who is working Elk Grove Toy Drive Celebration 2026. Open director seats live under each lane — tap Interested in joining to see roles and apply.</p>
      </section>
      <section>
        <h2>Leadership</h2>
        <p>Nikki Nguyen, Ellie King, Kevin P. Nguyen</p>
      </section>
    </div>
  </main>
  <div id="site-footer"></div>
  <script src="/vendor/lsds/lsds.iife.js"></script>
  <script src="../doc-scroll.js"></script>
  <script src="../site.js"></script>
  <script>
    (async function () {
      const {
        initPageShell,
        loadSiteData,
        mountFooter,
        renderTeamPage,
        initRosterLaneModals,
        initDocToc,
        setPageTitle,
        escapeHtml,
      } = window.ToyDriveSite;
      initPageShell("team");
      try {
        const site = await loadSiteData();
        setPageTitle(site, "Team");
        const rosterPage = site.teamPage?.rosterPage ?? {};
        const roster = site.teamPage?.roster ?? {};
        document.getElementById("main").innerHTML = `
          <section class="hero">
            <h1>${escapeHtml(rosterPage.headline ?? roster.title ?? "Team")}</h1>
            ${
              rosterPage.lead || roster.intro
                ? `<p class="hero-lead">${escapeHtml(rosterPage.lead ?? roster.intro)}</p>`
                : ""
            }
          </section>
          ${renderTeamPage(site)}
        `;
        initDocToc();
        initRosterLaneModals(document.getElementById("main"));
        mountFooter(site);
      } catch (err) {
        document.getElementById("main").innerHTML = `<p class="error-panel">${escapeHtml(err.message)}</p>`;
      }
    })();
  </script>
</body>
</html>
