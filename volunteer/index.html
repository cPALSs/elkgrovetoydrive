<!DOCTYPE html>
<html lang="en" data-theme="auto" data-ls-theme="verdant" data-ls-scheme="auto">
<head>
  <meta charset="UTF-8" />
  <script async src="https://www.googletagmanager.com/gtag/js?id=G-934PPCQGLJ"></script>
  <script src="../analytics.js"></script>

  <meta name="viewport" content="width=device-width, initial-scale=1" />
  <meta name="description" content="Volunteer interest sign-up for the Elk Grove Toy Drive Celebration — waitlisted until approved. Shifts on Sunday, December 6, 2026 at District 56." />
  <link rel="canonical" href="https://elkgrovetoydrive.com/volunteer/" />
  <meta property="og:title" content="Volunteer — Elk Grove Toy Drive Celebration" />
  <meta property="og:description" content="Interest sign-up for Toy Drive 2026. Waitlisted until we approve. Officer-led groups or individuals welcome." />
  <meta property="og:type" content="website" />
  <meta property="og:url" content="https://elkgrovetoydrive.com/volunteer/" />
  <meta name="twitter:card" content="summary" />
  <meta name="twitter:title" content="Volunteer — Elk Grove Toy Drive Celebration" />
  <meta name="twitter:description" content="Interest sign-up for Toy Drive 2026. Waitlisted until we approve." />

  <title>Volunteer — Elk Grove Toy Drive Celebration</title>
  <script src="../clean-urls.js"></script>
  <script>
    (function () {
      try {
        var t = sessionStorage.getItem("toydrive-theme");
        if (t === "light" || t === "dark") {
          document.documentElement.setAttribute("data-theme", t);
          document.documentElement.setAttribute("data-ls-scheme", t);
        }
      } catch (_) {}
    })();
  </script>
  <link rel="stylesheet" href="/vendor/lsds/fonts/metropolis.css" />
  <link rel="stylesheet" href="/vendor/lsds/lsds.css" />
  <link rel="stylesheet" href="/vendor/lsds/themes/verdant.css" />
  <link rel="stylesheet" href="../site.css" />
</head>
<body>
  <div id="site-nav"></div>
  <main class="page-wrap" id="main">
    <div id="seo-prerender" class="seo-prerender">
      <section class="hero">
        <h1>Volunteer for Toy Drive 2026</h1>
        <p>Interest sign-up — waitlisted until approved. Sunday, December 6 at District 56.</p>
        <p><a href="https://bglvol.com/iwlnnquc">Sign up to help day-of</a></p>
      </section>
    </div>
  </main>
  <div id="site-footer"></div>
  <script src="/vendor/lsds/lsds.iife.js"></script>
  <script src="../doc-scroll.js"></script>
  <script src="../site.js"></script>
  <script>
    (async function () {
      const { initPageShell, loadSiteData, mountFooter, escapeHtml } = window.ToyDriveSite;
      initPageShell("volunteer");
      try {
        const site = await loadSiteData();
        const v = site.volunteer || {};
        document.title = "Volunteer — Elk Grove Toy Drive Celebration";
        const openToItems = (v.openTo || [])
          .map((item) => `<li>${escapeHtml(item)}</li>`)
          .join("");
        const openToSection = openToItems
          ? `<section class="content-section volunteer-open-to">
            <h2>Open to</h2>
            <ul>${openToItems}</ul>
          </section>`
          : "";
        const bullets = (v.bullets || [])
          .map((b) => `<li>${escapeHtml(b)}</li>`)
          .join("");
        const contactEmail = v.contactEmail || "contact@elkgrovetoydrive.com";
        document.getElementById("main").innerHTML = `
          <section class="hero">
            <h1>${escapeHtml(v.headline || "Volunteer for Toy Drive 2026")}</h1>
            <p class="hero-lead">${escapeHtml(v.intro || "")}</p>
          </section>
          ${openToSection}
          <section class="content-section volunteer-how">
            <h2>How sign-up works</h2>
            <ul>${bullets}</ul>
            <p>Questions: <a href="mailto:${escapeHtml(contactEmail)}">${escapeHtml(contactEmail)}</a></p>
            <div class="cta-row">
              <a class="ls-btn ls-btn--primary" href="${escapeHtml(v.bugleUrl || "https://bglvol.com/iwlnnquc")}" rel="noopener">${escapeHtml(v.ctaLabel || "Sign up to help day-of")}</a>
              <a class="ls-btn ls-btn--secondary" href="/team/">Director roles</a>
            </div>
          </section>
        `;
        mountFooter(site);
      } catch (err) {
        document.getElementById("main").innerHTML = `<p class="error-panel">${escapeHtml(err.message)}</p>`;
      }
    })();
  </script>
</body>
</html>
